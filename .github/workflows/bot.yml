
name: OXYFANN Telegram Bot

on:
  workflow_dispatch:

jobs:
  telegram-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Jalankan Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -u bot.py
        
