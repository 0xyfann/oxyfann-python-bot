
name: OXYFANN Python Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tes Python
        run: |
          python --version
          python -c "print('OXYFANN Python Bot berhasil dijalankan!')"
